spring.application.name=brassaria-intranet
# Serviços de hospedagem informam a porta pela variável PORT
server.port=${PORT:8080}

# ===== Conexão com o banco =====
# Os valores vêm de variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD).
# Sem elas, usa os padrões abaixo, que batem com o docker-compose.yml.
# Para usar PostgreSQL, basta trocar a URL: jdbc:postgresql://host:5432/banco
# O Hibernate identifica o banco sozinho e o driver certo é escolhido pela URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brassaria_intranet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:brassaria}
spring.datasource.password=${DB_PASSWORD:brassaria123}

# ===== JPA / Hibernate =====
# "update" faz o Hibernate criar/atualizar as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Carrega coleções LAZY em lote (evita o problema N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ===== JSON =====
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
