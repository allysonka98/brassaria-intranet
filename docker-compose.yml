# Sobe o MySQL usado pela aplicação.
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: brassaria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: brassaria_intranet
      MYSQL_USER: ${DB_USERNAME:-brassaria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-brassaria123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - brassaria-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brassaria-dados:
